name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this release as a prerelease
        type: boolean
        default: true

permissions:
  contents: write

# Allocate versions only after the preceding release has finished publishing.
concurrency:
  group: aadisplay-release
  cancel-in-progress: false
  # GitHub supports queued runs; keep pending manual releases instead of replacing them.
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test release version generation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Generate release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git ls-remote --tags origin > "$RUNNER_TEMP/release-tags.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-names.txt"
          python3 -B .github/scripts/generate_release_version.py \
            --tags-file "$RUNNER_TEMP/release-tags.txt" \
            --releases-file "$RUNNER_TEMP/release-names.txt" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          missing=()
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]      && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]    && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All signing secrets present."

      - name: Check tag does not already exist
        run: |
          TAG="v${{ steps.version.outputs.VERSION_NAME }}"
          TAG_REF=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$TAG_REF" ]; then
            echo "::error::Tag $TAG was created after version allocation. Run the workflow again to allocate a new version."
            exit 1
          fi
          echo "Tag $TAG is available."

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build and verify release APK
        env:
          AADISPLAY_VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          AADISPLAY_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :aa-display:assembleRelease
          ./gradlew :aa-display:verifyReleaseXposedMetadata

      - name: Create draft release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION_NAME }}"
          APK=$(find aa-display/build/outputs/apk/release -name '*.apk' | head -1)
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AADisplay-101 ${{ steps.version.outputs.VERSION_NAME }}" \
            --notes "Release ${{ steps.version.outputs.VERSION_NAME }}" \
            --draft \
            $PRERELEASE_FLAG \
            "$APK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION_NAME }}"
          gh release edit "$TAG" --draft=false
